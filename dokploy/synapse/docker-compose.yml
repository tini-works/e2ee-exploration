# Matrix Synapse homeserver for Dokploy (compose app).
#
# Postgres is a SEPARATE Dokploy "Database" app (Dokploy provisions the role +
# database for you, so there's no manual role creation). This compose is just
# synapse; it connects to that database over dokploy-network.
#
# The image is built from ./Dockerfile, which bakes in synapse-entrypoint.sh —
# it renders /data/homeserver.yaml from env vars on first boot, generates the
# signing key, then starts synapse.
#
# Set in Dokploy's Environment tab:
#   SYNAPSE_DOMAIN               public domain (Traefik route)
#   SYNAPSE_SERVER_NAME          server_name baked into user IDs (usually = SYNAPSE_DOMAIN)
#   REGISTRATION_SHARED_SECRET   used by register_new_matrix_user
#   POSTGRES_HOST                the Dokploy database's internal host
#   POSTGRES_PASSWORD            the Dokploy database's password
#   POSTGRES_USER                optional, defaults to "synapse"
#   POSTGRES_DB                  optional, defaults to "synapse"
#   POSTGRES_PORT                optional, defaults to 5432
#
# Registration is open (enable_registration_without_verification), so users
# sign up from the app — no manual account creation needed.

services:
  synapse:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SYNAPSE_SERVER_NAME: ${SYNAPSE_SERVER_NAME}
      REGISTRATION_SHARED_SECRET: ${REGISTRATION_SHARED_SECRET}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_DB: ${POSTGRES_DB:-synapse}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      # Run synapse as 1000:1000 to match the chown in synapse-entrypoint.sh.
      UID: "1000"
      GID: "1000"
    volumes:
      - synapse_data:/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8008/_matrix/client/versions || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.synapse.rule=Host(`${SYNAPSE_DOMAIN}`)
      - traefik.http.routers.synapse.entrypoints=websecure
      - traefik.http.routers.synapse.tls.certresolver=letsencrypt
      - traefik.http.services.synapse.loadbalancer.server.port=8008

volumes:
  synapse_data:

networks:
  dokploy-network:
    external: true
